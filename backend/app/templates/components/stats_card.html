<!-- Stats card component - used for displaying key metrics -->
<!-- Usage: {% include 'components/stats_card.html' with label="Pageviews", value=12345, change=15, prev_value=10000 %} -->

<div class="bg-white rounded-lg shadow p-6 hover:shadow-md transition-shadow">
    <div class="flex items-center justify-between">
        <div class="flex-1">
            <p class="text-sm font-medium text-gray-600 mb-1">{{ label }}</p>
            <p class="text-3xl font-bold text-gray-900" id="{{ id_prefix }}-value">
                {{ value | default(0) | format_number }}
            </p>

            {% if change is defined and change != 0 %}
            <div class="mt-2 flex items-center text-sm">
                {% if change > 0 %}
                <svg class="w-4 h-4 text-green-500 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M5.293 9.707a1 1 0 010-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 01-1.414 1.414L11 7.414V15a1 1 0 11-2 0V7.414L6.707 9.707a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
                </svg>
                <span class="text-green-600 font-medium">+{{ change }}%</span>
                {% else %}
                <svg class="w-4 h-4 text-red-500 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M14.707 10.293a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 111.414-1.414L9 12.586V5a1 1 0 012 0v7.586l2.293-2.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                </svg>
                <span class="text-red-600 font-medium">{{ change }}%</span>
                {% endif %}
                <span class="text-gray-500 ml-1">vs previous period</span>
            </div>
            {% endif %}
        </div>

        {% if icon %}
        <div class="ml-4">
            <div class="text-3xl">{{ icon }}</div>
        </div>
        {% endif %}
    </div>
</div>
