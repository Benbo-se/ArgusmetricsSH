{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 py-12 px-4">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-lg shadow-xl p-8">
            <h3 class="text-xl font-semibold text-gray-900 mb-2">Choose a new password</h3>
            <p class="text-sm text-gray-600 mb-6">For your security, every other session will be signed out.</p>

            <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border-l-4 border-red-400 text-red-700 text-sm"></div>

            <form id="reset-form" class="space-y-6" data-on-submit="handleSetPassword">
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">New password</label>
                    <div class="relative">
                        <input id="password" name="password" type="password" required autocomplete="new-password"
                               data-on-input="updateChecklist" autofocus
                               class="appearance-none block w-full px-3 py-2 pr-10 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <button type="button" data-on-click="togglePw" data-target="password" aria-label="Show password"
                                class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600">👁</button>
                    </div>
                    <ul class="mt-2 space-y-1 text-xs" id="pw-checklist">
                        <li data-check="length" class="text-gray-500"><span class="check-mark">○</span> At least 8 characters</li>
                        <li data-check="not_all_digits" class="text-gray-500"><span class="check-mark">○</span> Not only numbers</li>
                        <li data-check="match" class="text-gray-500"><span class="check-mark">○</span> Passwords match</li>
                    </ul>
                </div>
                <div>
                    <label for="password2" class="block text-sm font-medium text-gray-700 mb-2">Confirm new password</label>
                    <input id="password2" name="password2" type="password" required autocomplete="new-password"
                           data-on-input="updateChecklist"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <button type="submit" id="submit-btn" disabled
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
                    Set new password
                </button>
            </form>
            <div class="mt-6 text-center">
                <a href="/login" class="text-sm text-blue-600 hover:text-blue-800">← Back to sign in</a>
            </div>
        </div>
    </div>
</div>

<script nonce="{{ request.state.csp_nonce }}">
const RESET_TOKEN = {{ token | tojson }};

// Called by the delegated listener in base.html: it hands over the event and
// the button, and the input's id comes from data-target on the button itself.
function togglePw(event, btn) {
    const el = document.getElementById(btn.dataset.target);
    if (!el) return;
    el.type = el.type === 'password' ? 'text' : 'password';
    btn.setAttribute('aria-label', el.type === 'password' ? 'Show password' : 'Hide password');
}

function updateChecklist() {
    const pw = document.getElementById('password').value;
    const pw2 = document.getElementById('password2').value;
    const checks = {
        length: pw.length >= 8,
        not_all_digits: !(pw.length > 0 && /^[0-9]+$/.test(pw)),
        match: pw.length > 0 && pw === pw2,
    };
    let allOk = true;
    document.querySelectorAll('#pw-checklist li').forEach(li => {
        const ok = checks[li.dataset.check];
        allOk = allOk && ok;
        li.className = ok ? 'text-green-600' : 'text-gray-500';
        li.querySelector('.check-mark').textContent = ok ? '✓' : '○';
    });
    document.getElementById('submit-btn').disabled = !allOk;
}

async function handleSetPassword(event) {
    event.preventDefault();
    const btn = document.getElementById('submit-btn');
    const err = document.getElementById('error-message');
    err.classList.add('hidden');
    btn.disabled = true; btn.textContent = 'Saving...';
    try {
        const r = await fetch('/api/v1/auth/set-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                token: RESET_TOKEN,
                password: document.getElementById('password').value
            })
        });
        const data = await r.json();
        if (r.ok) {
            btn.textContent = 'Saved! Signing in...';
            window.location.href = data.redirect || '/dashboard';
        } else {
            err.textContent = data.message || data.detail || 'The reset link is invalid or has expired.';
            err.classList.remove('hidden');
            btn.disabled = false; btn.textContent = 'Set new password';
        }
    } catch (e) {
        err.textContent = 'Network error. Please try again.';
        err.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Set new password';
    }
}
</script>
{% endblock %}
