# Produktions-compose för egen server (image-baserad, ingen kod-mount).
#
#   cd /opt/argusmetrics
#   docker compose -f docker/docker-compose.prod.yml up -d
#
# Kräver docker/.env (samma katalog som denna fil — compose hittar den själv).
# ${VAR:?} = starta INTE med saknad/default-hemlighet; hellre hård krasch än
# "changeme" i produktion. Imagen väljs med ARGUS_TAG (git-SHA från CI,
# default latest) — deploy-workflown sätter den, rollback = förra SHA:n.
#
# Exponering: endast web på 127.0.0.1:${WEB_PORT}. Värd-nginx terminerar TLS
# för argusmetrics.io och proxyar hit. Postgres och backend nås aldrig från
# värden/LAN, bara över det interna docker-nätet.

services:
  postgres:
    # Pinnad via digest (motsvarar latest-pg16 verifierad lokalt 2026-09-02)
    # så en deploy aldrig råkar dra in en ny major av databasen.
    image: timescale/timescaledb@sha256:68faf0bca42125ff98228a8f5a379bcf0ac588d8156f716be8aaf9befd65857f
    container_name: argusmetrics-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB saknas i docker/.env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER saknas i docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD saknas i docker/.env}
      # Lösenord för den avprivilegierade app-rollen (skapas vid första start)
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD saknas i docker/.env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - argusmetrics-network
    restart: unless-stopped

  backend:
    image: ghcr.io/benbo-se/argusmetrics-backend:${ARGUS_TAG:-latest}
    container_name: argusmetrics-backend
    environment:
      # Appen kör som den avprivilegierade rollen (DML only, äger inget);
      # migrationerna körs av entrypoint som databasägaren.
      DATABASE_URL: postgresql://argus_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY saknas i docker/.env}
      # Styr TrustedHost-allowlisten (en "www."-BASE_URL täcker även apex).
      BASE_URL: ${BASE_URL:?BASE_URL saknas i docker/.env}
      ENVIRONMENT: production
      DEBUG: "false"
      # Värd-nginx + web-containern sitter framför → lita på docker-nätets XFF.
      # Backend sitter bakom web-nginx-containern: lita på docker-nätets
      # proxy-hopp som default, annars ser rate-limiter/visitor-hash bara
      # proxy-IP:n och alla klienter kollapsar till en. Override:a vid behov
      # (t.ex. lägg till Cloudflares ranges).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-}
      # 730 by default: twenty-four months, stated in the privacy policy.
      # The dashboard's 365 day view compares against the 365 days before it,
      # so anything less makes that comparison empty. The purge batches, so it
      # cannot lock the tracking tables. See .env.example.
      # JSON in production: the log is read by a machine first there, and a
      # traceback stays one searchable line instead of thirty. Text is the
      # default elsewhere, for a person reading along.
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-730}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-10000}
      RETENTION_MAX_ROWS_PER_RUN: ${RETENTION_MAX_ROWS_PER_RUN:-0}
      EMAIL_LOG_RETENTION_DAYS: ${EMAIL_LOG_RETENTION_DAYS:-90}
      # Off by default: a private instance wants no event limit. See .env.example.
      MONTHLY_EVENT_LIMIT: ${MONTHLY_EVENT_LIMIT:-0}
      MAX_WEBSITES_PER_ACCOUNT: ${MAX_WEBSITES_PER_ACCOUNT:-100}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Argusmetrics}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-lettermint}
      LETTERMINT_API_KEY: ${LETTERMINT_API_KEY:-}
      LETTERMINT_FROM_EMAIL: ${LETTERMINT_FROM_EMAIL:-noreply@argusmetrics.io}
      LETTERMINT_FROM_NAME: ${LETTERMINT_FROM_NAME:-Argusmetrics}

      # Vem som får använda instansen. ENABLE_REGISTRATION=true betyder att
      # vem som helst på internet kan skapa konto.
      ENABLE_REGISTRATION: ${ENABLE_REGISTRATION:-false}
      ENABLE_EMAIL_VERIFICATION: ${ENABLE_EMAIL_VERIFICATION:-true}

      # Sessioner och engångslänkar.
      SESSION_EXPIRY_DAYS: ${SESSION_EXPIRY_DAYS:-30}
      MAGIC_TOKEN_EXPIRY_SECONDS: ${MAGIC_TOKEN_EXPIRY_SECONDS:-900}

      # Strypning. Auth-gränserna är hårdare än de allmänna eftersom det är
      # dem en brute force eller e-postbombning riktar sig mot.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-1000}
      RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-10000}
      AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}

      # Drift.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}

      # Varumärke. Byt om du kör instansen under eget namn. BRAND_NAME används
      # också i DNS-verifieringens TXT-post, så den får inte ändras efter att
      # någon verifierat en domän.
      APP_NAME: ${APP_NAME:-Argusmetrics}
      BRAND_NAME: ${BRAND_NAME:-argusmetrics}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - argusmetrics-network
    restart: unless-stopped

  web:
    image: ghcr.io/benbo-se/argusmetrics-web:${ARGUS_TAG:-latest}
    container_name: argusmetrics-web
    ports:
      # Loopback-only: nås bara av värd-nginx på samma maskin.
      - "127.0.0.1:${WEB_PORT:-8021}:80"
    depends_on:
      - backend
    networks:
      - argusmetrics-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  argusmetrics-network:
    driver: bridge
