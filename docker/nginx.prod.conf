# Produktions-nginx (körs som container, byggd via Dockerfile.web).
# Serverar marknadssiten (site/) statiskt på / och proxyar app-rutterna till
# backend-containern. TLS termineras av värd-nginx som proxyar hit på
# 127.0.0.1:${WEB_PORT} — därför lyssnar vi bara på port 80 utan cert.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Värd-nginx sätter X-Forwarded-Proto; skicka vidare orört (fallback http
    # för direktanrop vid lokal felsökning).
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream backend {
        server backend:8020;
    }

    server {
        listen 80;
        server_name _;

        # Marknadssiten (bakas in i imagen från site/)
        root /usr/share/nginx/html;
        index index.html;

        # ── App-rutter → backend ────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_redirect off;
            proxy_buffering off;
        }

        # HTML-sidor och redirects som backend äger (login, dashboard m.fl.)
        location ~ ^/(login|signup|verify|accept-invite|logout|demo|dashboard|public|health)(/|$) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_redirect off;
        }

        # Live-vyernas websockets (/ws/live/{id}, /ws/debug/{id})
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # ── Statiska filer ─────────────────────────────────────────────────
        # Sitens static/ vinner; saknas filen (t.ex. dashboardens assets som
        # bara finns i backend-imagen) proxas anropet vidare till backend.
        location /static/ {
            try_files $uri @backend_static;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location @backend_static {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location = /favicon.ico {
            alias /usr/share/nginx/html/static/favicon.ico;
            expires 30d;
        }

        # ── Marknadssiten ──────────────────────────────────────────────────
        # Clean URLs: /about → about.html, /compare/matomo → compare/matomo.html
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        error_page 404 /404.html;
    }
}
