# Produktions-nginx (körs som container, byggd via Dockerfile.web).
# Serverar marknadssiten (site/) statiskt på / och proxyar app-rutterna till
# backend-containern. TLS termineras av värd-nginx som proxyar hit på
# 127.0.0.1:${WEB_PORT} — därför lyssnar vi bara på port 80 utan cert.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Värd-nginx sätter X-Forwarded-Proto; skicka vidare orört (fallback http
    # för direktanrop vid lokal felsökning).
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Cache policy for stylesheets and scripts, decided by whether the URL
    # carries a content fingerprint.
    #
    # A request for /static/css/tailwind.min.css?v=a1b2c3d4 can be cached
    # forever, because the URL changes the moment the file does. One without a
    # fingerprint cannot: it is a fixed URL with moving content, and telling a
    # browser not to ask is how a fix fails to reach anyone who already
    # visited. That happened here.
    #
    # The default is the safe one, so an asset reference that slips through
    # unversioned costs a revalidation per hour rather than a month of serving
    # the wrong file.
    map $uri $is_tracker {
        default                    0;
        /static/tracker.min.js     1;
    }

    # The tracking script never takes the long branch even if someone appends
    # a version themselves. It is embedded in other people's pages at a URL we
    # do not control the shape of, and it has to stay fixable.
    map "$is_tracker$arg_v" $asset_cache {
        default     "public, max-age=3600";
        "~^0.+$"    "public, max-age=31536000, immutable";
    }

    upstream backend {
        server backend:8020;
    }

    server {
        listen 80;
        server_name _;

        # Relative Location headers on redirects. nginx builds an absolute URL
        # by default and guesses the scheme from how it was reached, which
        # behind TLS termination is plain http. So /docs, a directory without
        # its trailing slash, redirected to http://argusmetrics.io/docs/ and
        # the edge bounced it back to https: three hops, one of them in the
        # clear. A relative Location keeps the scheme the browser already has.
        absolute_redirect off;

        # Marknadssiten (bakas in i imagen från site/)
        root /usr/share/nginx/html;
        index index.html;

        # ── App-rutter → backend ────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_redirect off;
            proxy_buffering off;
        }

        # HTML-sidor och redirects som backend äger (login, dashboard m.fl.)
        location ~ ^/(login|signup|verify|reset|accept-invite|logout|dashboard|public|health)(/|$) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_redirect off;
        }

        # Live-vyernas websockets (/ws/live/{id}, /ws/debug/{id})
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # ── Statiska filer ─────────────────────────────────────────────────
        # Sitens static/ vinner; saknas filen (t.ex. dashboardens assets som
        # bara finns i backend-imagen) proxas anropet vidare till backend.

        # The tracking script is the one file under /static/ that other
        # people's pages embed, at a URL that never changes, and it is
        # therefore the one file here that has to stay fixable.
        #
        # It was covered by the rule below: thirty days, immutable. immutable
        # means the browser does not even ask whether the file changed, so a
        # returning visitor keeps running whatever they cached for up to a
        # month. When a ReferenceError shipped in this file, the fix could not
        # reach anyone who had already loaded a page. Ours arrived at new
        # visitors only, which is not what shipping a fix means.
        #
        # An hour, revalidated. Eight kilobytes with an ETag makes the
        # revalidation a 304, and a broken tracker stops being broken within
        # the hour rather than within the month.
        location = /static/tracker.min.js {
            try_files $uri @backend_static_short;
            expires 1h;
        }

        # Stylesheets and scripts change on every deploy and sit at fixed
        # URLs with no content hash in the name, so `immutable` is simply
        # wrong for them: it tells the browser not to ask, and then a fix
        # cannot arrive. That was measured, not assumed. tailwind.min.css was
        # being served thirty days immutable, so a returning user could get
        # today's server-rendered markup against last month's stylesheet.
        #
        # An hour with revalidation instead. The response is a 304 almost
        # every time, which costs a round trip and no bytes.
        #
        # If these ever get content-hashed filenames, thirty days immutable
        # becomes the right answer for them too, and better than this.
        location ~* ^/static/.+\.(css|js)$ {
            try_files $uri @backend_static_short;
            add_header Cache-Control $asset_cache;
        }

        location /static/ {
            try_files $uri @backend_static;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Two named locations, because `expires` does not follow try_files into
        # one. Everything the dashboard loads lives only in the backend image
        # and therefore arrives through here, which is why those files were
        # being served with no cache directive at all while the ones in site/
        # got thirty days.
        location @backend_static {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location @backend_static_short {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            add_header Cache-Control $asset_cache;
        }

        location = /favicon.ico {
            alias /usr/share/nginx/html/static/favicon.ico;
            expires 30d;
        }

        # ── Marknadssiten ──────────────────────────────────────────────────
        # Clean URLs: /about → about.html, /compare/matomo → compare/matomo.html
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        error_page 404 /404.html;
    }
}
