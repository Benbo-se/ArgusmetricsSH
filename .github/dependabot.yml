# Dependency updates as pull requests, not as a gate on deployment.
#
# Deliberately not a CI job that fails the build: this repository deploys from
# green main, so a scanner that goes red on a transitive advisory with no fix
# available would stop shipping unrelated work. A pull request asks for a
# decision; a red build takes it away.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for routine bumps, separate ones for anything major,
      # so review effort follows risk.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
