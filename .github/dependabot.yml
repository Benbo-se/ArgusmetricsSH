# Dependency updates as pull requests, not as a gate on deployment.
#
# Deliberately not a CI job that fails the build: this repository deploys from
# green main, so a scanner that goes red on a transitive advisory with no fix
# available would stop shipping unrelated work. A pull request asks for a
# decision; a red build takes it away.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for routine bumps, separate ones for anything major,
      # so review effort follows risk.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tailwind 4 ar en migrering, inte en bump: CLI:t flyttade till ett eget
      # paket, konfigurationen blev CSS-forst, och safelist finns inte langre.
      # Just safelisten haller klasser som satts vid rendering, och en
      # oversattning som missar nagra ger ratt bygge, inga fel och fel layout.
      # Stegen och kontrollen som gor den trygg star i #77. Ta bort det har
      # blocket samma dag migreringen gors.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
