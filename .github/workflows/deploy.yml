name: Deploy

# "Auto-bygg, grindad deploy" — braleads-mönstret, SSH-varianten (INTE
# self-hosted runner: repot är publikt och GitHub avråder self-hosted runners
# på publika repos). CI bygger images på grön main; deployen här gör:
# pre-deploy DB-dump -> git pull (compose/conf-ändringar) -> pull images ->
# compose up -> health-check -> auto-rollback vid fel -> PROD-tagg.
#
# GRINDEN: körs vid manuellt "Run workflow" (dispatch), eller automatiskt
# efter grön CI på main om repo-variabeln DEPLOY_ENABLED=true. Environmenten
# 'production' kan dessutom ges required reviewer för klick-godkännande.
#
# Kräver secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
# Servern: git-klon i /opt/argusmetrics + ifylld docker/.env (gitignorad).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image-tag att deploya (git-SHA, default latest)'
        required: false
        default: 'latest'
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Bestäm image-tag
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy (dump -> pull -> up -> health -> auto-rollback)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_TAG: ${{ steps.t.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_TAG
          script: |
            set -euo pipefail
            cd /opt/argusmetrics
            COMPOSE="docker compose -f docker/docker-compose.prod.yml"

            # Skriv den tag som faktiskt kor till docker/.env, som compose
            # laser. Utan den ger compose-filens ${ARGUS_TAG:-latest} tillbaka
            # "latest" sa fort nagon kor up -d utan att sjalv skicka med taggen,
            # och efter en rollback betyder det att rollbacken tyst gors om.
            record_tag() {
              local tag="$1"
              if grep -qE '^ARGUS_TAG=' docker/.env; then
                sed -i -E "s|^ARGUS_TAG=.*|ARGUS_TAG=$tag|" docker/.env
              else
                printf '\n# Skriven av deployen: imagen som senast passerade health-checken.\nARGUS_TAG=%s\n' "$tag" >> docker/.env
              fi
              echo "docker/.env: ARGUS_TAG=$tag"
            }
            WEB_PORT=$(grep -E '^WEB_PORT=' docker/.env | cut -d= -f2 || true)
            WEB_PORT=${WEB_PORT:-8021}
            echo "Deployar tag: $DEPLOY_TAG (web-port $WEB_PORT)"

            echo "==> git pull (compose/conf-ändringar följer med releasen)"
            git fetch origin main
            git reset --hard origin/main

            # 1. Pre-deploy DB-dump (billig försäkring). Best-effort:
            #    blockerar inte deployen om den misslyckas.
            TS=$(date +%Y%m%d-%H%M%S)
            mkdir -p "$HOME/backups/argusmetrics/pre-deploy"
            if $COMPOSE exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' \
                | gzip > "$HOME/backups/argusmetrics/pre-deploy/predeploy-$TS.sql.gz"; then
              echo "DB-dump sparad: predeploy-$TS.sql.gz"
            else
              echo "VARNING: pre-deploy DB-dump misslyckades (fortsätter ändå)"
            fi

            # Rotera dem. Den nattliga dumpen har gjort det sedan den skrevs,
            # den har inte, sa varje deploy sedan starten ligger kvar. 26
            # lyckade deployer den 8 september gav ensamma ~78 MB, pa samma
            # disk som databasen de skyddar. Sju dagar racker gott: efter en
            # vecka ar den nattliga dumpen den man vill ha anda.
            find "$HOME/backups/argusmetrics/pre-deploy" -name 'predeploy-*.sql.gz' \
                 -mtime +7 -print -delete || true

            # 2. Spara nuvarande tag för ev. rollback (backend + web deployas
            #    alltid i par med samma tag).
            PREV=$(docker inspect --format '{{.Config.Image}}' argusmetrics-backend 2>/dev/null | sed 's/.*://' || true)
            echo "Nuvarande tag: ${PREV:-<ingen>}"

            # 3. Hämta + starta nya images.
            ARGUS_TAG="$DEPLOY_TAG" $COMPOSE pull backend web
            ARGUS_TAG="$DEPLOY_TAG" $COMPOSE up -d

            # 4. Health-check genom hela kedjan (värdport -> web-nginx ->
            #    backend -> postgres); /health rapporterar DB-status.
            #    Host-headern måste vara BASE_URL:ens host — backendens
            #    TrustedHost-allowlist avvisar annars 127.0.0.1 med 400.
            BASE_HOST=$(grep -E '^BASE_URL=' docker/.env | sed -E 's#^BASE_URL=##; s#https?://##; s#/.*##')
            OK=0
            for i in $(seq 1 20); do
              BODY=$(curl -fsS -H "Host: ${BASE_HOST:-127.0.0.1}" "http://127.0.0.1:$WEB_PORT/health" 2>/dev/null || true)
              if echo "$BODY" | grep -q '"status":"healthy"'; then OK=1; break; fi
              echo "väntar på health ($i/20)"; sleep 3
            done

            # 5. Auto-rollback om nya releasen inte blir frisk.
            if [ "$OK" != "1" ]; then
              echo "HEALTH-CHECK FAILADE efter deploy av $DEPLOY_TAG"
              if [ -n "${PREV:-}" ]; then
                echo "Rullar tillbaka till $PREV"
                ARGUS_TAG="$PREV" $COMPOSE up -d
                record_tag "$PREV"
              else
                echo "Ingen tidigare tag att rulla tillbaka till."
              fi
              exit 1
            fi

            # 6. Forst nu, nar health-checken sagt ja, ar taggen vard att
            #    minnas. En deploy som foll ska inte lamna sitt eget nummer i
            #    .env.
            record_tag "$DEPLOY_TAG"

            echo "==> städa gamla images"
            docker image prune -f >/dev/null
            echo "Deploy OK och frisk: $DEPLOY_TAG"

  # Auto-tagga varje lyckad deploy: PROD-YYYY-MM-DD[-N] (samma som braleads).
  tag:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Skapa PROD-tagg på deployad commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sha = context.payload.workflow_run?.head_sha ?? context.sha;
            const date = new Date().toISOString().slice(0, 10);
            const base = `PROD-${date}`;
            let name = base;
            for (let i = 2; i < 20; i++) {
              try {
                await github.rest.git.getRef({ ...context.repo, ref: `tags/${name}` });
                name = `${base}-${i}`;
              } catch (e) {
                if (e.status === 404) break;
                throw e;
              }
            }
            // Taggen ar bokforing. Utrullningen och health-checken har redan
            // passerat nar vi kommer hit, sa ett fel harifran betyder inte att
            // deployen misslyckades -- men det farger korningen rod, och en
            // deploy som ser misslyckad ut fast produktionen ar frisk ar hur
            // man slutar titta i listan. Se #88: ett 403 uppstod en gang med
            // exakt den behorighet endpointen kraver, gick inte att aterskapa,
            // och forsvann av sig sjalvt.
            //
            // Ett omforsok, och sedan en varning i stallet for ett kast. En
            // varning syns i korningens sammanfattning, sa ett ihallande fel
            // ar fortfarande synligt utan att ljuga om utrullningen.
            const tag = async () =>
              github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${name}`, sha });

            try {
              await tag();
              core.notice(`Taggade deploy: ${name} -> ${sha.slice(0, 7)}`);
            } catch (first) {
              core.warning(`Taggningen foll (${first.status}): ${first.message}. Forsoker igen.`);
              await new Promise(r => setTimeout(r, 5000));
              try {
                await tag();
                core.notice(`Taggade deploy pa andra forsoket: ${name} -> ${sha.slice(0, 7)}`);
              } catch (second) {
                core.warning(
                  `Kunde inte tagga ${name} -> ${sha.slice(0, 7)} (${second.status}): `
                  + `${second.message}. Utrullningen och health-checken gick igenom; `
                  + `det har ar bokforing. Se #88, och tagga for hand med: `
                  + `gh api repos/${context.repo.owner}/${context.repo.repo}/git/refs `
                  + `-f ref=refs/tags/${name} -f sha=${sha}`
                );
              }
            }
