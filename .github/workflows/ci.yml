name: CI/CD

# Testgrind -> bygg backend- + web-image -> push till GHCR (bara grön main)
# -> behåll 7 senaste. Deploy sker separat (deploy.yml). Samma mönster som
# braleads/hushroom. Doc-ändringar triggar ingenting.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_BACKEND: ghcr.io/benbo-se/argusmetrics-backend
  IMAGE_WEB: ghcr.io/benbo-se/argusmetrics-web

jobs:
  # ── 1. Smoke-grind: appen startar mot riktig TimescaleDB och svarar ──────
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinnad till exakt samma digest som docker-compose.prod.yml, så CI
        # testar mot den databas produktionen faktiskt kör. Med latest-pg16
        # kunde samma commit ge olika resultat olika dagar, och skillnaden
        # mellan test- och driftmiljö är där den här kodbasens dyraste buggar
        # har suttit.
        image: timescale/timescaledb@sha256:68faf0bca42125ff98228a8f5a379bcf0ac588d8156f716be8aaf9befd65857f
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      # CI-only dummies — riktiga secrets finns bara i .env på servern.
      DATABASE_URL: postgresql://argus:argus@localhost:5432/argus_ci
      SECRET_KEY: ci-dummy-secret-key-0123456789abcdefghijklmnop
      ENVIRONMENT: production
      DEBUG: "false"
      # Utan port: TrustedHostMiddleware (aktiv i prod-läge) strippar porten
      # från inkommande Host och jämför mot BASE_URL:ens host.
      BASE_URL: http://127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # samma som docker/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installera dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: CSS-bygget är i synk med mallarna
        run: |
          # A Tailwind class that is not in the build does nothing at all: no
          # error, no warning, just the wrong layout. That cost six separate
          # debugging sessions while the CSS was a frozen file nobody rebuilt.
          # Rebuilding here and demanding no diff turns it into a red build.
          npm ci --no-audit --no-fund
          npm run build:css --silent
          if ! git diff --quiet -- backend/app/static/css/tailwind.min.css site/static/css/tailwind.min.css; then
            echo "::error::CSS-bygget matchar inte mallarna. Kör 'npm run build:css' och committa resultatet."
            git diff --stat -- backend/app/static/css/tailwind.min.css site/static/css/tailwind.min.css
            exit 1
          fi
          echo "CSS-bygget är aktuellt."
      - name: Migrera (alembic upgrade head mot tom databas = fresh-install-testet)
        working-directory: backend
        run: alembic upgrade head

      - name: Modellerna matchar migrationerna (ingen glömd migration)
        working-directory: backend
        run: |
          # Against the database the step above just built from nothing, so
          # this asks whether the migrations alone produce the schema the
          # models describe. A new model with no migration behind it fails
          # here instead of in production.
          #
          # This gap used to be papered over: the app called
          # Base.metadata.create_all() on startup in development, so a missing
          # migration was invisible locally and only surfaced on deploy. That
          # call is gone, and this is what replaces it.
          alembic check
      - name: Cross-tenant-isolering (RLS) mot en icke-priviligierad roll
        env:
          PGPASSWORD: argus
        run: |
          # Policies never apply to a table's owner, and CI migrates as the
          # owner, so the test has to connect as someone else. Without this the
          # assertions would pass while proving nothing; the test itself checks
          # that its role is neither owner, superuser nor BYPASSRLS and fails
          # loudly if that stops being true.
          psql -h localhost -U argus -d argus_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE rls_test LOGIN PASSWORD 'rls_test';
          GRANT CONNECT ON DATABASE argus_ci TO rls_test;
          GRANT USAGE ON SCHEMA public TO rls_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO rls_test;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO rls_test;
          SQL
          cd backend
          # Both files: isolation between tenants, and the flows that run
          # without an authenticated caller. Anything that has to hold as the
          # production role belongs here, because nothing else in the suite
          # connects as anything but the owner.
          RLS_TEST_DATABASE_URL=postgresql://rls_test:rls_test@localhost:5432/argus_ci \
            python -m pytest tests/test_tenant_isolation.py tests/test_invitation_isolation.py -v

      - name: Backup går att återställa (dump -> restore -> räkna raderna)
        env:
          PGPASSWORD: argus
        run: |
          set -euo pipefail
          # The procedure that had never been run. Dumps were taken before
          # every deployment and nothing ever restored one, and when I finally
          # did, every table came back empty: the schema restored, then the
          # data load aborted on a conflict in TimescaleDB's own catalog.
          # It looks like success unless you count something, which is why
          # this counts.
          # Seeded deliberately, because a comparison of zero against zero
          # passes without proving anything. The pageviews go into two chunks
          # so the restore has to bring back the partitioning, not just rows.
          psql -h localhost -U argus -d argus_ci -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO users (email, is_verified, created_at)
          VALUES ('restore-check@example.com', true, now())
          ON CONFLICT (email) DO NOTHING;

          INSERT INTO websites (name, domain, user_email, tracking_code,
                                verification_token, is_verified, is_active,
                                email_reports_enabled, is_public,
                                public_password_enabled, created_at)
          VALUES ('Restore check', 'https://restore-check.example',
                  'restore-check@example.com', 'restorechk', 'tok-restorechk',
                  true, true, false, false, false, now())
          ON CONFLICT (domain) DO NOTHING;

          INSERT INTO pageviews (website_id, path, visitor_hash, "timestamp")
          SELECT w.id, '/restore-' || g, 'hash-' || g,
                 now() - make_interval(days => g * 10)
            FROM websites w, generate_series(0, 4) g
           WHERE w.tracking_code = 'restorechk';
          SQL

          BEFORE=$(psql -h localhost -U argus -d argus_ci -tAc 'SELECT count(*) FROM users')
          REVISION=$(psql -h localhost -U argus -d argus_ci -tAc 'SELECT version_num FROM alembic_version')
          # users is an ordinary table, and counting only it was the weak
          # point of this drill: the failure being guarded against is
          # TimescaleDB's catalog aborting the data load, and that is exactly
          # what would leave the HYPERTABLES empty while users came back fine.
          # So count a hypertable, its chunks, and the policies that isolate
          # tenants — a restore that loses those is not a restore.
          BEFORE_PV=$(psql -h localhost -U argus -d argus_ci -tAc 'SELECT count(*) FROM pageviews')
          BEFORE_CHUNKS=$(psql -h localhost -U argus -d argus_ci -tAc 'SELECT count(*) FROM timescaledb_information.chunks')
          BEFORE_POLICIES=$(psql -h localhost -U argus -d argus_ci -tAc 'SELECT count(*) FROM pg_policies')
          echo "före: $BEFORE users, $BEFORE_PV pageviews, $BEFORE_CHUNKS chunkar, $BEFORE_POLICIES policyer, revision $REVISION"

          pg_dump --clean --if-exists -h localhost -U argus argus_ci | gzip > /tmp/ci-backup.sql.gz
          gzip -t /tmp/ci-backup.sql.gz
          echo "dump: $(stat -c %s /tmp/ci-backup.sql.gz) bytes"

          psql -h localhost -U argus -d postgres -q -c 'DROP DATABASE IF EXISTS restore_check'
          psql -h localhost -U argus -d postgres -q -c 'CREATE DATABASE restore_check'

          # See scripts/verify-backup.sh: without the bracketing the restore
          # produces a complete schema and zero rows.
          psql -h localhost -U argus -d restore_check -q \
            -c 'CREATE EXTENSION IF NOT EXISTS timescaledb; SELECT timescaledb_pre_restore();'
          gunzip -c /tmp/ci-backup.sql.gz | psql -h localhost -U argus -d restore_check -v ON_ERROR_STOP=1 -q
          psql -h localhost -U argus -d restore_check -q -c 'SELECT timescaledb_post_restore();'

          AFTER=$(psql -h localhost -U argus -d restore_check -tAc 'SELECT count(*) FROM users')
          AFTER_PV=$(psql -h localhost -U argus -d restore_check -tAc 'SELECT count(*) FROM pageviews')
          AFTER_CHUNKS=$(psql -h localhost -U argus -d restore_check -tAc 'SELECT count(*) FROM timescaledb_information.chunks')
          AFTER_POLICIES=$(psql -h localhost -U argus -d restore_check -tAc 'SELECT count(*) FROM pg_policies')
          RESTORED_REVISION=$(psql -h localhost -U argus -d restore_check -tAc 'SELECT version_num FROM alembic_version')
          echo "efter: $AFTER users, $AFTER_PV pageviews, $AFTER_CHUNKS chunkar, $AFTER_POLICIES policyer, revision $RESTORED_REVISION"

          [ "$AFTER" = "$BEFORE" ] || { echo "::error::Återställningen gav $AFTER users, källan hade $BEFORE"; exit 1; }
          [ "$AFTER_PV" = "$BEFORE_PV" ] || { echo "::error::Hypertabellen kom tillbaka med $AFTER_PV rader, källan hade $BEFORE_PV"; exit 1; }
          [ "$AFTER_CHUNKS" = "$BEFORE_CHUNKS" ] || { echo "::error::$AFTER_CHUNKS chunkar återställda, källan hade $BEFORE_CHUNKS"; exit 1; }
          [ "$AFTER_POLICIES" = "$BEFORE_POLICIES" ] || { echo "::error::$AFTER_POLICIES RLS-policyer återställda, källan hade $BEFORE_POLICIES. En återställning utan policyer är oisolerad."; exit 1; }
          [ "$RESTORED_REVISION" = "$REVISION" ] || { echo "::error::Fel schemarevision efter återställning"; exit 1; }
          psql -h localhost -U argus -d restore_check -tAc \
            "SELECT count(*) FROM users WHERE email='restore-check@example.com'" | grep -q 1 \
            || { echo "::error::Den kända raden överlevde inte återställningen"; exit 1; }

          psql -h localhost -U argus -d postgres -q -c 'DROP DATABASE restore_check'
          echo "Backupen går att återställa."

      - name: Funktionstester (rutter mot riktig Postgres, allt rullas tillbaka)
        working-directory: backend
        # Runs on the job's DATABASE_URL, so as the table owner. That is
        # deliberate: these test what the routes do, and the step above tests
        # what the policies allow. Each write is rolled back afterwards.
        run: python -m pytest tests/ --ignore=tests/test_tenant_isolation.py -v

      - name: Starta appen (prod-läge, schemat kommer från migrationerna)
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8020 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8020/health >/dev/null 2>&1 && break
            echo "väntar på app ($i)"; sleep 2
          done
      - name: Smoke-test (health, sidor, och en riktig DB-rundtur via signup)
        run: |
          set -euo pipefail
          BODY=$(curl -fsS http://127.0.0.1:8020/health)
          echo "health: $BODY"
          # "degraded" is a real state now: the database is fine and a
          # scheduled job has not succeeded recently. A fresh CI instance has
          # never run one, so healthy is what it should report, and degraded
          # here would mean the never-run grace period is broken.
          echo "$BODY" | grep -q '"status":"healthy"' \
            || { echo 'health svarar men status != healthy (DB, eller ett jobb rapporteras stannat på en ny instans?)'; exit 1; }
          for path in /login /signup; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8020$path")
            echo "$path -> $CODE"
            [ "$CODE" = "200" ] || { echo "oväntad status för $path"; exit 1; }
          done
          # Signup skriver till users-tabellen -> fångar tomt/trasigt schema,
          # vilket rena sid-render-tester missar.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8020/api/v1/auth/signup \
            -H 'Content-Type: application/json' -d '{"email":"ci-smoke@example.com","password":"ci-battery-staple7"}')
          echo "signup -> $CODE"
          case "$CODE" in 200|201) ;; *) echo "signup misslyckades"; exit 1;; esac
          COUNT=$(PGPASSWORD=argus psql -h localhost -U argus -d argus_ci -tAc "SELECT count(*) FROM users WHERE email='ci-smoke@example.com'")
          echo "users-rader: $COUNT"
          [ "$COUNT" = "1" ] || { echo "signup skapade ingen användarrad"; exit 1; }
          # Full lösenords-rundtur utan e-postberoende: verifiera kontot direkt
          # i databasen, logga in med lösenord, hämta /me med sessionscookien.
          PGPASSWORD=argus psql -h localhost -U argus -d argus_ci -c "UPDATE users SET is_verified=true WHERE email='ci-smoke@example.com'" >/dev/null
          CODE=$(curl -s -c /tmp/ci-cookies.txt -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8020/api/v1/auth/login \
            -H 'Content-Type: application/json' -d '{"email":"ci-smoke@example.com","password":"ci-battery-staple7"}')
          echo "login -> $CODE"
          [ "$CODE" = "200" ] || { echo "lösenordslogin misslyckades"; exit 1; }
          CODE=$(curl -s -b /tmp/ci-cookies.txt -o /dev/null -w '%{http_code}' http://127.0.0.1:8020/api/v1/auth/me)
          echo "/me (authed) -> $CODE"
          [ "$CODE" = "200" ] || { echo "sessionen fungerar inte"; exit 1; }
          # Fel lösenord ska ge generisk 401
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8020/api/v1/auth/login \
            -H 'Content-Type: application/json' -d '{"email":"ci-smoke@example.com","password":"fel-lösenord"}')
          echo "login fel pw -> $CODE"
          [ "$CODE" = "401" ] || { echo "fel lösenord gav inte 401"; exit 1; }

      - name: Starta en andra instans för end-to-end (icke-prod)
        working-directory: backend
        env:
          # A second process, not a weakened first one. The instance above
          # stays in production mode, which is what the smoke test and the
          # pytest suite exercise.
          #
          # End-to-end needs to read a verification link, and there is no mail
          # server in CI. The codebase already has the answer: X-E2E-Secret,
          # which works only outside production, only for
          # @test.argusmetrics.io addresses, and only when presented. Keeping
          # that closed in production is the point, so this runs somewhere
          # else rather than opening it.
          ENVIRONMENT: development
          # DEBUG on, matching the development container the suite passes
          # against locally. It is what auto-verifies a new website's domain
          # (dev_auto_verified in website_service), and without it every
          # tracking test is refused with "Domain not verified". There is no
          # DNS to verify against in CI.
          DEBUG: "true"
          E2E_TEST_SECRET: ci-e2e-secret-not-a-production-value
          AUTH_RATE_LIMIT_ATTEMPTS: 5000
          BASE_URL: http://127.0.0.1:8021
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8021 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8021/health >/dev/null 2>&1 && break
            echo "väntar på e2e-appen ($i)"; sleep 2
          done

      - name: Servera marknadssajten (egen origin, som i produktion)
        run: |
          # The app and the site are two things behind one domain in
          # production. The landing suite needs the site, not the app, which
          # redirects / to /login.
          #
          # site/serve.py rather than http.server, because nginx serves
          # /contact from contact.html (try_files $uri $uri.html) and
          # http.server 404s it. The suite fetches the clean URLs the site
          # really has.
          SERVE_QUIET=1 python3 site/serve.py 8099 &
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8099/ >/dev/null 2>&1 && break
            echo "väntar på sajten ($i)"; sleep 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: End-to-end (Playwright mot den körande appen)
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:8021
          SITE_URL: http://127.0.0.1:8099
          E2E_TEST_SECRET: ci-e2e-secret-not-a-production-value
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line
      - name: Spara Playwright-artefakter när något faller
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # ── 2. Hygien: prod-compose och nginx-conf är giltiga ────────────────────
  hygiene:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: x
      POSTGRES_USER: x
      POSTGRES_PASSWORD: x
      APP_DB_PASSWORD: x
      SECRET_KEY: x
      BASE_URL: x
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker/docker-compose.prod.yml config -q
      - name: Validera nginx-confen (utan backend-upstream-uppslag)
        run: |
          docker run --rm -v "$PWD/docker/nginx.prod.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/site:/usr/share/nginx/html:ro" \
            --entrypoint sh nginx:1.27-alpine -c \
            "echo '127.0.0.1 backend' >> /etc/hosts && nginx -t"
      - name: Trackern är byggd från källan och i synk överallt
        working-directory: frontend/tracking-script
        run: |
          npm install --silent
          npx terser src/tracker.js --config-file terser.config.json -o /tmp/tracker.check.js
          cmp /tmp/tracker.check.js ../../backend/app/static/tracker.min.js || { echo "backend/app/static/tracker.min.js ur synk med src — kör 'npm run build' i frontend/tracking-script"; exit 1; }
          cmp /tmp/tracker.check.js ../../site/static/tracker.min.js || { echo "site/static/tracker.min.js ur synk med src — kör 'npm run build'"; exit 1; }

  # ── 3. Bygg båda images; push till GHCR bara på grön main ────────────────
  build:
    needs: [smoke, hygiene]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Logga in på GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bygg (och pusha) backend-imagen
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: docker/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Bygg (och pusha) web-imagen (nginx + site/)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ── 4. Behåll bara 7 senaste image-versionerna per paket ─────────────────
  cleanup:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Städa argusmetrics-backend
        continue-on-error: true   # <7 versioner första körningarna
        uses: actions/delete-package-versions@v5
        with:
          package-name: argusmetrics-backend
          package-type: container
          min-versions-to-keep: 7
      - name: Städa argusmetrics-web
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: argusmetrics-web
          package-type: container
          min-versions-to-keep: 7
