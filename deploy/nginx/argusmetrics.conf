# Argusmetrics - proxar till web-containern på 127.0.0.1:8021.
# Appen sätter sina egna säkerhetsheaders inklusive en nonce-baserad CSP;
# lägg ingen CSP här.
#
# Värd-nginx vhost, installerad av deployen via /usr/local/sbin/argus-host-nginx
# (se deploy/argus-host-nginx). Ändra här, inte på servern: deployen skriver
# över serverns kopia med den här filen.

server {
    server_name argusmetrics.io;

    client_max_body_size 20m;

    # Ingen access-logg här. Värdens standardformat skriver besökarens riktiga
    # adress och hela query-strängen, där verifierings-, återställnings- och
    # inbjudningslänkarnas tokens ligger. Web-containern loggar samma
    # förfrågningar utan adress och utan query (docker/nginx.prod.conf).
    access_log off;

    # Websockets för realtidsvyn.
    location /ws/ {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/argusmetrics.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/argusmetrics.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# www -> apex. Måste finnas: backendens TrustedHost släpper bara igenom
# apex-formen, så www-trafik som når backend skulle avvisas med 400.
server {
    server_name www.argusmetrics.io;
    access_log off;
    return 301 https://argusmetrics.io$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/argusmetrics.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/argusmetrics.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = argusmetrics.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name argusmetrics.io;
    access_log off;

    listen 80;
    return 404; # managed by Certbot


}
server {
    if ($host = www.argusmetrics.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name www.argusmetrics.io;
    access_log off;
    listen 80;
    return 404; # managed by Certbot


}
